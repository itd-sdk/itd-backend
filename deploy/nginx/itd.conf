# nginx instead of Caddy (use one of them: both need ports 80/443).
#   sudo cp deploy/nginx/itd.conf /etc/nginx/sites-available/itd
#   replace itd.example.com and /var/www/itd below, then:
#   sudo ln -s /etc/nginx/sites-available/itd /etc/nginx/sites-enabled/itd
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d itd.example.com      # HTTPS: adds the 443 server and the redirect

server {
    listen 80;
    listen [::]:80;
    server_name itd.example.com;

    # built web client (deploy/frontend/dist)
    root /var/www/itd;

    # uploads: MAX_VIDEO_SIZE_MB=200 plus multipart overhead
    client_max_body_size 210m;

    # the build ships .gz copies of js/css/html/svg; others are compressed on the fly
    gzip_static on;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # backend; drop "swagger|" to keep the API docs private
    location ~ ^/(api|uploads|health|swagger)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the backend trusts these headers (TRUST_PROXY=true): pass the real client address only,
        # never values sent by the client
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Connection "";
        # server-sent events (/api/notifications/stream)
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # hashed file names: cache forever (add_header skips error responses)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /cdn/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # event mini-app (the frame of /event/...): its own app shell, 404 when it was not mirrored
    location ~ ^/public/events/([^/]+)/ {
        try_files $uri /public/events/$1/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # single-page app: unknown paths render index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
